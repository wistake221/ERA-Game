name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          mkdir -p app
          unzip -q -o project.zip -d app
          P=$(dirname "$(find app -name pubspec.yaml | head -n1)")
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --project-name era_mobile --org com.willy /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: era-mobile-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
